services:
  - type: web
    name: labourlink-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: labourlink-db
          property: connectionString

  - type: web
    name: labourlink-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://labourlink-backend.onrender.com/api

databases:
  - name: labourlink-db
    plan: free
